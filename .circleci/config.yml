version: 2.1
parameters:
  windows-image:
    type: string
    default: windows-server-2025-gui:2026.10.1
  macos-xcode:
    type: string
    default: 16.4.0
  macos-arm-resource:
    type: string
    default: m4pro.medium
  run-supported-native-validation:
    type: boolean
    default: true
  release-authority-probe:
    type: boolean
    default: false
commands:
  fetch-history:
    steps:
    - run:
        name: Read full tag history and current remote main
        command: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow origin
          fi
          git fetch --tags origin
          git fetch origin refs/heads/main:refs/remotes/origin/main
jobs:
  presentation:
    docker:
    - image: cimg/node:24.22.1
    steps:
    - checkout
    - run:
        name: Require Node 24; check presentation without GUI or real profiles
        command: |
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
          node --check docs/assets/site.js
          node --check docs/assets/guide.js
          python3 scripts/verify-site.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
          git diff --check
    - run:
        name: Native coverage is separate
        command: echo 'PRESENTATION ONLY. Six native GUI lanes remain required; no release authorization.'
  windows-native:
    parameters:
      python-series:
        type: enum
        enum:
        - '3.11'
        - '3.14'
        - '3.15'
      mode:
        type: enum
        enum:
        - probe
        - validation
    machine:
      image: << pipeline.parameters.windows-image >>
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass
    environment:
      CSL_PIPELINE_ID: << pipeline.id >>
    steps:
    - checkout
    - run:
        name: Read full history without replacing tags
        command: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse --is-shallow-repository) -eq 'true') {
            git fetch --unshallow origin
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin refs/heads/main:refs/remotes/origin/main
          exit $LASTEXITCODE
    - run:
        name: Exact Python, application suite and extracted-package GUI smoke
        command: ./scripts/ci/windows.ps1 -Series '<< parameters.python-series >>' -Mode '<< parameters.mode >>'
        no_output_timeout: 15m
    - store_artifacts:
        path: release-artifacts/ci-receipts
    - store_artifacts:
        path: release-artifacts/ci-runtime/provision.json
    - store_artifacts:
        path: release-artifacts/release-manifest.json
    - store_artifacts:
        path: release-artifacts/SHA256SUMS.txt
    - persist_to_workspace:
        root: release-artifacts
        paths:
        - ci-receipts
  macos-native:
    parameters:
      python-series:
        type: enum
        enum:
        - '3.14'
        - '3.15'
      architecture:
        type: enum
        enum:
        - arm
      native-resource:
        type: string
      mode:
        type: enum
        enum:
        - probe
        - validation
    macos:
      xcode: << pipeline.parameters.macos-xcode >>
    resource_class: << parameters.native-resource >>
    environment:
      CSL_PIPELINE_ID: << pipeline.id >>
      CSL_PYTHON_SERIES: << parameters.python-series >>
      CSL_ARCHITECTURE: << parameters.architecture >>
    steps:
    - checkout
    - fetch-history
    - run:
        name: Provision verified PSF Python/Tk, full suite and extracted-package GUI smoke
        command: python3 scripts/ci/provision.py --series "$CSL_PYTHON_SERIES" --mode '<< parameters.mode >>'
        no_output_timeout: 15m
    - store_artifacts:
        path: release-artifacts/ci-receipts
    - store_artifacts:
        path: release-artifacts/ci-runtime/provision.json
    - store_artifacts:
        path: release-artifacts/release-manifest.json
    - store_artifacts:
        path: release-artifacts/SHA256SUMS.txt
    - persist_to_workspace:
        root: release-artifacts
        paths:
        - ci-receipts
  native-coverage:
    parameters:
      expectation:
        type: enum
        enum:
        - complete-native
        - supported-native
        default: complete-native
    docker:
    - image: cimg/python:3.14
    environment:
      CSL_PIPELINE_ID: << pipeline.id >>
    steps:
    - checkout
    - attach_workspace:
        at: /tmp/native-evidence
    - run: python3 scripts/ci/gate.py --receipts /tmp/native-evidence/ci-receipts --expectation '<< parameters.expectation
        >>'
  hybrid-coverage:
    docker: &id001
    - image: cimg/python:3.14
    resource_class: small
    environment: &id002
      CSL_PIPELINE_ID: << pipeline.id >>
    steps:
    - checkout
    - fetch-history
    - attach_workspace:
        at: /tmp/native-evidence
    - run:
        name: Require five CircleCI GUI receipts and the exact Intel Actions proof
        command: |
          set -euo pipefail
          args=()
          if [[ -n "${CIRCLE_TAG:-}" ]]; then args+=(--release); fi
          python3 scripts/ci/hybrid.py --receipts /tmp/native-evidence/ci-receipts "${args[@]}"
        no_output_timeout: 12m
    - store_artifacts:
        path: release-artifacts/ci-hybrid
  publish-release:
    docker: *id001
    resource_class: small
    environment: *id002
    steps:
    - checkout
    - fetch-history
    - attach_workspace:
        at: /tmp/native-evidence
    - run:
        name: Recheck tag, hybrid proof and hashes; publish using ephemeral checkout authority
        command: |
          test "${CSL_RELEASE_PUBLICATION_AUTHORIZED:-false}" = true
          test "${CSL_CHECKOUT_CONTENTS_WRITE_CONFIRMED:-false}" = true
          python3 scripts/ci/release_publish.py --receipts /tmp/native-evidence/ci-receipts
        no_output_timeout: 12m
    - store_artifacts:
        path: release-artifacts/ci-hybrid
    - store_artifacts:
        path: release-artifacts/SHA256SUMS.txt
  release-authority-probe:
    docker: *id001
    resource_class: small
    environment: *id002
    steps:
    - checkout
    - fetch-history
    - run:
        name: Prove draft and asset authority without publishing a release
        command: python3 scripts/ci/probe_authority.py
    - store_artifacts:
        path: release-artifacts/ci-authority
workflows:
  native-validation:
    when:
      and:
      - << pipeline.parameters.run-supported-native-validation >>
      - or:
        - equal:
          - ''
          - << pipeline.git.tag >>
        - matches:
            pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
            value: << pipeline.git.tag >>
    jobs:
    - presentation:
        filters: &id003
          tags:
            only: /.*/
    - windows-native:
        name: windows-native-py<< matrix.python-series >>
        mode: validation
        filters: *id003
        matrix:
          alias: windows-required
          parameters:
            python-series:
            - '3.11'
            - '3.14'
            - '3.15'
    - macos-native:
        name: macos-arm-native-py<< matrix.python-series >>
        architecture: arm
        native-resource: << pipeline.parameters.macos-arm-resource >>
        mode: validation
        filters: *id003
        matrix:
          alias: macos-arm-required
          parameters:
            python-series:
            - '3.14'
            - '3.15'
    - hybrid-coverage:
        requires:
        - presentation
        - windows-required
        - macos-arm-required
        filters: *id003
    - publish-release:
        requires:
        - hybrid-coverage
        context: csl-release
        serial-group: << pipeline.project.slug >>/desktop-release
        filters:
          branches:
            ignore: /.*/
          tags:
            only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
  presentation-only:
    when:
      not: << pipeline.parameters.run-supported-native-validation >>
    jobs:
    - presentation
  manual-authority-probe:
    when: << pipeline.parameters.release-authority-probe >>
    jobs:
    - release-authority-probe:
        context: csl-release
        filters:
          branches:
            only: main
